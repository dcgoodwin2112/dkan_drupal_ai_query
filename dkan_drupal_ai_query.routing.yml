dkan_drupal_ai_query.start:
  path: '/api/dkan-ai-query/start'
  defaults:
    _controller: 'dkan_drupal_ai_query.controller:start'
  methods: [POST]
  requirements:
    _permission: 'use dkan drupal ai query'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

dkan_drupal_ai_query.poll:
  path: '/api/dkan-ai-query/poll/{thread_id}'
  defaults:
    _controller: 'dkan_drupal_ai_query.controller:poll'
  methods: [GET]
  requirements:
    _permission: 'use dkan drupal ai query'
    thread_id: '[a-zA-Z0-9_-]+'
  options:
    no_cache: TRUE

dkan_drupal_ai_query.conversation_list:
  path: '/api/dkan-ai-query/conversations'
  defaults:
    _controller: 'dkan_drupal_ai_query.conversation_controller:list'
  methods: [GET]
  requirements:
    _permission: 'manage own dkan drupal ai query conversations'
  options:
    no_cache: TRUE

dkan_drupal_ai_query.conversation_load:
  path: '/api/dkan-ai-query/conversations/{id}'
  defaults:
    _controller: 'dkan_drupal_ai_query.conversation_controller:load'
  methods: [GET]
  requirements:
    _permission: 'manage own dkan drupal ai query conversations'
    id: '\d+'
  options:
    no_cache: TRUE

dkan_drupal_ai_query.conversation_delete:
  path: '/api/dkan-ai-query/conversations/{id}'
  defaults:
    _controller: 'dkan_drupal_ai_query.conversation_controller:delete'
  methods: [DELETE]
  requirements:
    _permission: 'manage own dkan drupal ai query conversations'
    _csrf_request_header_token: 'TRUE'
    id: '\d+'
  options:
    no_cache: TRUE

dkan_drupal_ai_query.conversation_toggle_pin:
  path: '/api/dkan-ai-query/conversations/{id}/pin'
  defaults:
    _controller: 'dkan_drupal_ai_query.conversation_controller:togglePin'
  methods: [POST]
  requirements:
    _permission: 'manage own dkan drupal ai query conversations'
    _csrf_request_header_token: 'TRUE'
    id: '\d+'
  options:
    no_cache: TRUE

dkan_drupal_ai_query.settings_form:
  path: '/admin/config/dkan/ai-query'
  defaults:
    _form: '\Drupal\dkan_drupal_ai_query\Form\SettingsForm'
    _title: 'DKAN AI Query Settings'
  requirements:
    _permission: 'administer dkan drupal ai query'

dkan_drupal_ai_query.test_page:
  path: '/admin/dkan/ai-query-test'
  defaults:
    _controller: 'dkan_drupal_ai_query.controller:testPage'
    _title: 'DKAN AI Query — Phase 1 Test'
  requirements:
    _permission: 'administer dkan drupal ai query'
