services:
  dkan_ai_query_mock.scenario_loader:
    class: Drupal\dkan_ai_query_mock\Service\ScenarioLoader
    arguments:
      - '@extension.path.resolver'
      - '@cache.default'

  dkan_ai_query_mock.scenario_matcher:
    class: Drupal\dkan_ai_query_mock\Service\ScenarioMatcher
    arguments:
      - '@dkan_ai_query_mock.scenario_loader'
      - '@request_stack'
      - '@state'

  dkan_ai_query_mock.emergency_override_subscriber:
    class: Drupal\dkan_ai_query_mock\EventSubscriber\EmergencyOverrideSubscriber
    arguments:
      - '@state'
    tags:
      - { name: event_subscriber }

  dkan_ai_query_mock.fixture_loader:
    class: Drupal\dkan_ai_query_mock\Service\FixtureLoader
    arguments:
      - '@extension.list.module'
      - '@dkan.harvest.service'
      - '@dkan.metastore.service'
      - '@queue'
      - '@plugin.manager.queue_worker'
      - '@database'
      - '@state'
      - '@logger.channel.dkan_ai_query_mock'
      - '%app.root%'

  logger.channel.dkan_ai_query_mock:
    parent: logger.channel_base
    arguments: [ 'dkan_ai_query_mock' ]
