dkan_drupal_ai_query.settings:
  type: config_object
  label: 'DKAN AI Query settings'
  mapping:
    default_model:
      type: string
      label: 'Default model'
    allowed_models:
      type: sequence
      label: 'Allowed models'
      sequence:
        type: string
        label: 'Provider__model option'
    show_model_selector:
      type: boolean
      label: 'Show model selector'
    show_examples:
      type: boolean
      label: 'Show example questions'
    show_debug_panel:
      type: boolean
      label: 'Show tool-calls debug panel'
    save_chat_history:
      type: boolean
      label: 'Save chat history'
    show_follow_up_suggestions:
      type: boolean
      label: 'Show follow-up suggestion chips'
    show_table_toggle:
      type: boolean
      label: 'Show / Hide table toggle'
    show_api_call:
      type: boolean
      label: 'Show / Hide API call button'
    show_sql:
      type: boolean
      label: 'Show / Hide SQL button'
    show_provenance:
      type: boolean
      label: 'Show / Hide provenance button'
    show_download_csv:
      type: boolean
      label: 'Download CSV button'
    show_copy_buttons:
      type: boolean
      label: 'Copy API / SQL buttons'
    show_simple_table_artifacts:
      type: boolean
      label: 'Render table for non-query tool calls'
    show_aux_tool_calls:
      type: boolean
      label: 'Show "Behind the scenes" panel'
    show_rest_playground_sidebar:
      type: boolean
      label: 'Show REST API playground sidebar'
    show_method_summary:
      type: boolean
      label: 'Show method summary'
    enable_raw_query_tool:
      type: boolean
      label: 'Enable query_datastore_raw passthrough tool'
    max_iterations:
      type: integer
      label: 'Max agent iterations'
    conversation_retention_days:
      type: integer
      label: 'Conversation retention (days)'
    debug_log_level:
      type: string
      label: 'Debug log level'

block.settings.dkan_drupal_ai_query_widget:
  type: block_settings
  label: 'DKAN AI Query Widget block'
  mapping:
    dataset_id:
      type: string
      label: 'Dataset UUID'

dkan_drupal_ai_query.caveat.*:
  type: config_entity
  label: 'Dataset caveat'
  mapping:
    id:
      type: string
      label: 'Machine ID (slugged dataset UUID)'
    label:
      type: label
      label: 'Dataset label (denormalized title)'
    dataset_uuid:
      type: string
      label: 'Dataset UUID'
    suppression:
      type: text
      label: 'Suppression / data-quality note'
      nullable: true
    column_caveats:
      type: sequence
      label: 'Column caveats'
      sequence:
        type: text
        label: 'Caveat text'
    freshness:
      type: mapping
      label: 'Freshness'
      mapping:
        updated:
          type: string
          label: 'Updated'
        coverage:
          type: string
          label: 'Coverage'
    code_lists:
      type: sequence
      label: 'Code lists'
      sequence:
        type: sequence
        label: 'Values'
        sequence:
          type: string
          label: 'Value'
