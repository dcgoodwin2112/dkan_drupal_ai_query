dkan_drupal_ai_query.settings:
  type: config_object
  label: 'DKAN AI Query settings'
  mapping:
    default_model:
      type: string
      label: 'Default model'
    show_model_selector:
      type: boolean
      label: 'Show model selector'
    show_examples:
      type: boolean
      label: 'Show example questions'
    show_debug_panel:
      type: boolean
      label: 'Show tool-calls debug panel'
    save_chat_history:
      type: boolean
      label: 'Save chat history'
    show_follow_up_suggestions:
      type: boolean
      label: 'Show follow-up suggestion chips'

block.settings.dkan_drupal_ai_query_widget:
  type: block_settings
  label: 'DKAN AI Query Widget block'
  mapping:
    dataset_id:
      type: string
      label: 'Dataset UUID'

dkan_drupal_ai_query.caveat.*:
  type: config_entity
  label: 'Dataset caveat'
  mapping:
    id:
      type: string
      label: 'Machine ID (slugged dataset UUID)'
    label:
      type: label
      label: 'Dataset label (denormalized title)'
    dataset_uuid:
      type: string
      label: 'Dataset UUID'
    suppression:
      type: text
      label: 'Suppression / data-quality note'
      nullable: true
    column_caveats:
      type: sequence
      label: 'Column caveats'
      sequence:
        type: text
        label: 'Caveat text'
    freshness:
      type: mapping
      label: 'Freshness'
      mapping:
        updated:
          type: string
          label: 'Updated'
        coverage:
          type: string
          label: 'Coverage'
    code_lists:
      type: sequence
      label: 'Code lists'
      sequence:
        type: sequence
        label: 'Values'
        sequence:
          type: string
          label: 'Value'
