services:
  dkan_drupal_ai_query.resource_id_resolver:
    class: Drupal\dkan_drupal_ai_query\Service\ResourceIdResolver
    arguments:
      - '@dkan_query_tools.metastore'
      - '@dkan_query_tools.datastore'
      - '@logger.channel.dkan_drupal_ai_query'

  dkan_drupal_ai_query.artifact_storage:
    class: Drupal\dkan_drupal_ai_query\Service\ArtifactStorage
    arguments:
      - '@tempstore.private'

  dkan_drupal_ai_query.refusal_collector:
    class: Drupal\dkan_drupal_ai_query\Service\RefusalCollector

  dkan_drupal_ai_query.artifact_capture_subscriber:
    class: Drupal\dkan_drupal_ai_query\EventSubscriber\ArtifactCaptureSubscriber
    arguments:
      - '@dkan_drupal_ai_query.artifact_storage'
      - '@logger.channel.dkan_drupal_ai_query'
      - '@dkan_drupal_ai_query.resource_id_resolver'
      - '@dkan.datastore.service'
      - '@dkan_drupal_ai_query.refusal_collector'
    tags:
      - { name: event_subscriber }

  dkan_drupal_ai_query.conversation_storage:
    class: Drupal\dkan_drupal_ai_query\Service\ConversationStorage
    arguments:
      - '@entity_type.manager'

  dkan_drupal_ai_query.system_prompt_loader:
    class: Drupal\dkan_drupal_ai_query\Service\SystemPromptLoader
    arguments:
      - '@extension.path.resolver'

  dkan_drupal_ai_query.system_prompt_subscriber:
    class: Drupal\dkan_drupal_ai_query\EventSubscriber\SystemPromptSubscriber
    arguments:
      - '@dkan_drupal_ai_query.system_prompt_loader'
      - '@logger.channel.dkan_drupal_ai_query'
    tags:
      - { name: event_subscriber }

  dkan_drupal_ai_query.dataset_caveat_registry:
    class: Drupal\dkan_drupal_ai_query\Service\DatasetCaveatRegistry
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.dkan_drupal_ai_query'

  dkan_drupal_ai_query.suggestion_generator:
    class: Drupal\dkan_drupal_ai_query\Service\SuggestionGenerator
    arguments:
      - '@ai.provider'
      - '@logger.channel.dkan_drupal_ai_query'

  dkan_drupal_ai_query.controller:
    class: Drupal\dkan_drupal_ai_query\Controller\NlQueryController
    arguments:
      - '@plugin.manager.ai_agents'
      - '@ai.provider'
      - '@ai_agents.agent_status_poller'
      - '@dkan_drupal_ai_query.artifact_storage'
      - '@dkan_drupal_ai_query.conversation_storage'
      - '@current_user'
      - '@logger.channel.dkan_drupal_ai_query'
      - '@config.factory'
      - '@dkan_drupal_ai_query.suggestion_generator'
      - '@dkan_drupal_ai_query.system_prompt_loader'
      - '@dkan_drupal_ai_query.refusal_collector'
    tags:
      - { name: 'controller.service_arguments' }

  dkan_drupal_ai_query.conversation_controller:
    class: Drupal\dkan_drupal_ai_query\Controller\ConversationController
    arguments:
      - '@dkan_drupal_ai_query.conversation_storage'
      - '@current_user'
    tags:
      - { name: 'controller.service_arguments' }

  logger.channel.dkan_drupal_ai_query:
    class: Drupal\Core\Logger\LoggerChannel
    factory: ['@logger.factory', 'get']
    arguments: ['dkan_drupal_ai_query']

  dkan_drupal_ai_query.eval.loader:
    class: Drupal\dkan_drupal_ai_query\Eval\GoldenCaseLoader

  dkan_drupal_ai_query.eval.evaluator:
    class: Drupal\dkan_drupal_ai_query\Eval\CaseEvaluator

  dkan_drupal_ai_query.eval.reporter:
    class: Drupal\dkan_drupal_ai_query\Eval\RunReporter

  dkan_drupal_ai_query.eval.runner:
    class: Drupal\dkan_drupal_ai_query\Eval\EvalRunner
    arguments:
      - '@plugin.manager.ai_agents'
      - '@ai.provider'
      - '@dkan_drupal_ai_query.artifact_storage'
      - '@dkan_drupal_ai_query.eval.evaluator'
      - '@logger.channel.dkan_drupal_ai_query'
      - '@dkan_drupal_ai_query.refusal_collector'
      - '@dkan_drupal_ai_query.system_prompt_loader'
