# dkan_drupal_ai_query eval golden set
#
# Each case runs end-to-end through the dkan_data_query agent. Pass/fail is
# determined by CaseEvaluator (see src/Eval/CaseEvaluator.php). Phase 1 uses
# heuristic refusal detection; Phase 3 will switch to a structured RefuseTool
# signal.
#
# Schema (per case):
#   id:                       unique slug, used for filtering with --case=
#   question:                 user-facing question
#   expected_dataset_id:      UUID the model should land on (null for refusal cases)
#   expected_columns_used:    columns the answer should reference (advisory)
#   expected_answer_pattern:  case-insensitive regex matched against the answer
#   forbidden_answer_pattern: case-insensitive regex that must NOT appear
#   expected_refusal:         true if the model should decline
#   expected_refusal_category: required RefuseTool reason_category (e.g.
#                             out_of_scope, out_of_coverage). Pins refusal
#                             routing — fails as wrong_refusal_category if
#                             the structured payload says otherwise.
#   expected_failure_category: when set, scored as a fail of that category if
#                             the model does not refuse. Used for dsl_limitation.
#   expected_tool_calls:      list of tool names the run must invoke at least
#                             once. Pins routing fixes (e.g. compute_stats for
#                             median). Fails as missing_required_tool.
#   forbidden_tool_calls:     list of tool names the run must NOT invoke. Pins
#                             negative-routing fixes (e.g. no sample_rows for
#                             "first N rows"). Fails as used_forbidden_tool.
#   notes:                    free text
#
# Editing:
#   Add cases by appending to `cases:`. Re-run `drush dkan-aiq:eval` to score.
#   For new datasets, run `drush dkan:list_datasets` and `drush dkan:get_datastore_schema`
#   to confirm column names before writing patterns.

cases:
  - id: crime_houston_violent_total
    question: "How many violent crimes were reported in Houston?"
    expected_dataset_id: d460252e-d42c-474a-9ea9-5287b1d595f6
    expected_columns_used: [city, violent_crimes]
    expected_answer_pattern: '22[,.\s]?008'
    expected_refusal: false
    notes: "Simple lookup. Houston violent_crimes = 22008."

  - id: foreclosure_california_total
    question: "How many foreclosures did California have in January 2012?"
    expected_dataset_id: 74c06c81-9fe0-439c-aba9-cd5c980a6df4
    expected_columns_used: [state, totalforeclosures]
    expected_answer_pattern: '51[,.\s]?584'
    expected_refusal: false
    notes: "Filtered lookup, totalforeclosures column."

  - id: asthma_california_adults
    question: "What is the current asthma prevalence among adults in California?"
    expected_dataset_id: 95f8eac4-fd1f-4b35-8472-5c87e9425dfa
    expected_columns_used: [state, age_range, current_asthma_prevalence]
    expected_answer_pattern: '7\.9'
    expected_refusal: false
    notes: "Filtered lookup with age_range = Adults."

  - id: crime_homicides_chicago_synonym
    question: "How many homicides were reported in Chicago?"
    expected_dataset_id: d460252e-d42c-474a-9ea9-5287b1d595f6
    expected_columns_used: [city, murder_and_nonnegligent_manslaughter]
    expected_answer_pattern: '\d+'
    expected_refusal: false
    notes: "Wrong-column synonym: 'homicides' must resolve to murder_and_nonnegligent_manslaughter via schema lookup, not direct match."

  - id: refusal_no_matching_dataset
    question: "How many electric vehicles were sold in the United States in 2023?"
    expected_dataset_id: null
    expected_columns_used: []
    expected_answer_pattern: null
    expected_refusal: true
    notes: "Catalog has no EV sales data. Should refuse, not invent."

  - id: refusal_write_request
    question: "Please delete the gold prices dataset from the catalog."
    expected_dataset_id: null
    expected_columns_used: []
    expected_answer_pattern: null
    expected_refusal: true
    notes: "Write requests are out of scope. Should refuse without attempting."

  - id: varicella_out_of_coverage
    question: "What was the Varicella mortality rate for 5-to-9-year-olds in 2020?"
    expected_dataset_id: e1f2ebcd-ee23-454f-87b5-df0306658418
    expected_columns_used: [year, 5_to_9_years_old]
    expected_answer_pattern: null
    expected_refusal: true
    notes: "Varicella dataset covers 1991-2007. 2020 is out of coverage; should refuse or explicitly acknowledge no data for that year."

  - id: dsl_yoy_varicella
    question: "What was the year-over-year change in mortality for the 1-to-4-year-old age group in the Varicella dataset?"
    expected_dataset_id: e1f2ebcd-ee23-454f-87b5-df0306658418
    expected_columns_used: [year, 1_to_4_years_old]
    expected_answer_pattern: null
    expected_refusal: true
    expected_failure_category: dsl_limitation
    notes: "DSL limit: requires LAG or self-join. Graceful refusal passes; confident structured query fails as dsl_limitation."

  - id: dsl_above_avg_crime
    question: "Which cities had above-average violent crime rates per 100,000 people?"
    expected_dataset_id: d460252e-d42c-474a-9ea9-5287b1d595f6
    expected_columns_used: [city, violent_crime_rate_per_100000_people]
    expected_answer_pattern: null
    expected_refusal: true
    expected_failure_category: dsl_limitation
    notes: "DSL limit: requires subquery to compare against the average. No subqueries in DatastoreQuery."

  - id: dsl_percentile_gold
    question: "What was the 90th percentile gold price each decade?"
    expected_dataset_id: 5dc1cfcf-8028-476c-a020-f58ec6dd621c
    expected_columns_used: [date, price]
    expected_answer_pattern: null
    expected_refusal: true
    expected_failure_category: dsl_limitation
    notes: "Still a DSL limit even with compute_stats: percentile alone is now answerable (see stats_percentile_gold), but per-decade bucketing requires a derived expression the DSL doesn't support, and compute_stats operates on a column, not per-group buckets."

  # ---------------------------------------------------------------------------
  # compute_stats cases (v4 prompt). Each targets a stat the DSL cannot express
  # but compute_stats can: median, percentile, correlation. These pass when the
  # agent fetches rows with query_datastore then calls compute_stats. Patterns
  # are intentionally loose on first authoring; tighten after an empirical run.
  # ---------------------------------------------------------------------------

  - id: stats_percentile_gold
    question: "What is the 90th percentile of the gold price across the entire dataset?"
    expected_dataset_id: 5dc1cfcf-8028-476c-a020-f58ec6dd621c
    expected_columns_used: [price]
    expected_answer_pattern: '\d'
    expected_refusal: false
    notes: "Should call query_datastore (price column, no aggregation) → compute_stats {type:percentile,column:price,p:90}. Pattern is loose; tighten to actual computed value after first empirical run."

  - id: stats_median_violent_crime_rate
    question: "What is the median violent crime rate per 100,000 people across all cities in the FBI UCR data?"
    expected_dataset_id: d460252e-d42c-474a-9ea9-5287b1d595f6
    expected_columns_used: [violent_crime_rate_per_100000_people]
    expected_answer_pattern: '\d'
    expected_refusal: false
    notes: "Should call query_datastore (rate column, no aggregation) → compute_stats {type:median,column:violent_crime_rate_per_100000_people}. Replaces the dsl_above_avg_crime refusal pattern with a positive-stats answer. Pattern is loose; tighten after first run."

  - id: stats_correlation_violent_murder_rate
    question: "In the FBI UCR Crime in U.S. dataset, across cities, what's the correlation between violent_crime_rate_per_100000_people and murder_rate_per_100000_people?"
    expected_dataset_id: d460252e-d42c-474a-9ea9-5287b1d595f6
    expected_columns_used: [violent_crime_rate_per_100000_people, murder_rate_per_100000_people]
    expected_answer_pattern: '0?\.\d|correlat'
    expected_refusal: false
    notes: "Should call query_datastore (both rate columns) → compute_stats {type:correlation,columns:[violent_crime_rate_per_100000_people,murder_rate_per_100000_people]}. Both columns confirmed present via get_datastore_schema. Pattern accepts a numeric correlation coefficient or the word 'correlat'; tighten after first stable run."

  # ---------------------------------------------------------------------------
  # Data-dictionary lift cases. Each targets behavior that should improve when
  # the get_datastore_schema response carries dictionary_title /
  # dictionary_description / dictionary_type per column. v2 prompt does not
  # mention dictionaries, so any pass-rate delta on these cases between v2 and
  # v3 is attributable to the dictionary integration.
  # ---------------------------------------------------------------------------

  - id: dict_bike_lncd_meaning
    question: "What does the LNCD column in the Florida bike lanes data represent?"
    expected_dataset_id: cedcd327-4e5d-43f9-8eb1-c11850fa7c55
    expected_columns_used: [lncd]
    expected_answer_pattern: 'lane[ _-]?(code|class)'
    expected_refusal: false
    notes: "Dictionary: 'Lane classification code.' Without dictionary, model would guess from the cryptic column name."

  - id: dict_bike_road_side_codes
    question: "What values appear in the road_side column of the Florida bike lanes dataset, and what do they mean?"
    expected_dataset_id: cedcd327-4e5d-43f9-8eb1-c11850fa7c55
    expected_columns_used: [road_side]
    expected_answer_pattern: '\bl\b.{0,30}\br\b|left.{0,15}right|side of the road'
    expected_refusal: false
    notes: "Dictionary: 'Side of the road on which the bike lane is located (e.g., L, R).' v2 would need distinct_values or sample_rows."

  - id: dict_crime_violent_breakdown
    question: "What crimes are counted in the violent_crimes column of the crime dataset?"
    expected_dataset_id: d460252e-d42c-474a-9ea9-5287b1d595f6
    expected_columns_used: [violent_crimes]
    expected_answer_pattern: 'aggravated\s+assault'
    expected_refusal: false
    notes: "Dictionary lists 'sum of murder, rape, robbery, aggravated assault'. The phrase 'aggravated assault' specifically (vs generic 'assault') is the dictionary-derived signal. Loose pattern because the answer's markdown formatting exceeds tight character distances."

  - id: dict_gold_price_units
    question: "What units are the values in the gold prices dataset reported in?"
    expected_dataset_id: 5dc1cfcf-8028-476c-a020-f58ec6dd621c
    expected_columns_used: [price]
    expected_answer_pattern: 'USD|U\.S\.\s*dollar|US\s*dollar|per\s+ounce'
    expected_refusal: false
    notes: "Dictionary: 'Monthly average price of one ounce of fine gold in USD'. v2 might guess GBP given London market."

  - id: dict_varicella_age_bucket
    question: "In the pre-vaccine Varicella dataset, what does the 1_to_4_years_old column count?"
    expected_dataset_id: e1f2ebcd-ee23-454f-87b5-df0306658418
    expected_columns_used: ['1_to_4_years_old']
    expected_answer_pattern: '(varicella|chickenpox).{0,30}death|death.{0,30}(varicella|chickenpox|child)'
    expected_refusal: false
    notes: "Dictionary (1974-1990 distribution): 'Varicella deaths in children aged 1 to 4 years.' v2 wouldn't know the column counts deaths vs cases."

  - id: dict_bike_objectid_purpose
    question: "What is the objectid column for in the Florida bike lanes dataset?"
    expected_dataset_id: cedcd327-4e5d-43f9-8eb1-c11850fa7c55
    expected_columns_used: [objectid]
    expected_answer_pattern: '(feature\s+record|internal.{0,20}identifier|record.{0,15}identifier|unique.{0,15}identifier)'
    expected_refusal: false
    notes: "Dictionary: 'Internal feature record identifier.' v2 would guess 'unique key' which would also pass — kept for symmetry with the rest of the bike-lanes documentation cases."

  - id: dict_asthma_pct_units_caveat
    question: "Is California's adult asthma prevalence value 7.9 percent or 7.9 per thousand?"
    expected_dataset_id: 95f8eac4-fd1f-4b35-8472-5c87e9425dfa
    expected_columns_used: [current_asthma_prevalence]
    expected_answer_pattern: '(7\.9|7\s*\.\s*9).{0,30}(percent|%)'
    expected_refusal: false
    notes: "Dictionary description clarifies units; the cell is stored with a trailing %. v2 would have to infer from sample_rows."

  - id: dict_asthma_storage_disagreement
    question: "Is the current_asthma_prevalence column stored as a number or as text in the Asthma dataset?"
    expected_dataset_id: 95f8eac4-fd1f-4b35-8472-5c87e9425dfa
    expected_columns_used: [current_asthma_prevalence]
    expected_answer_pattern: '(string|text|stored.{0,15}(as.{0,5})?(string|text)|trailing\s*%)'
    expected_refusal: false
    notes: "Dictionary type=string AND DB type=string here, but the value is semantically numeric — tests whether the agent calls out the trailing-% storage caveat per the v3 prompt rule."

  # ---------------------------------------------------------------------------
  # Dictionary-level cases (vs. column-level above). These ask about the
  # dictionary as a unit — the use case where the dedicated get_data_dictionary
  # tool's unique features (full field list, dictionary title, deep-link URL)
  # would naturally apply. If the agent answers these from get_datastore_schema
  # alone, the dedicated tool is genuinely redundant and can be removed.
  # ---------------------------------------------------------------------------

  - id: dict_meta_florida_documented
    question: "Is there documentation available for the Florida bike lanes dataset?"
    expected_dataset_id: cedcd327-4e5d-43f9-8eb1-c11850fa7c55
    expected_columns_used: []
    expected_answer_pattern: '(yes|data dictionary|documentation|documented)'
    expected_refusal: false
    notes: "Meta-question about the dictionary's existence. Could route through get_data_dictionary or be inferred from get_datastore_schema's dictionary_url root key."

  - id: dict_meta_asthma_full_listing
    question: "List all the documented fields in the Asthma Prevalence data dictionary along with their descriptions."
    expected_dataset_id: 95f8eac4-fd1f-4b35-8472-5c87e9425dfa
    expected_columns_used: []
    expected_answer_pattern: 'state.{0,200}(age_range|prevalence|standard_error)'
    expected_refusal: false
    notes: "Wants the dictionary as a unit. The dedicated tool returns the full field list cleanly; the schema tool requires the agent to reconstruct the listing from per-column keys."

  - id: dict_meta_gold_dict_link
    question: "Where can I find the data dictionary for the gold prices dataset? Give me the URL."
    expected_dataset_id: 5dc1cfcf-8028-476c-a020-f58ec6dd621c
    expected_columns_used: []
    expected_answer_pattern: '/api/1/metastore/schemas/data-dictionary/items/'
    expected_refusal: false
    notes: "Wants the dictionary URL specifically. Both tools return it (schema response under dictionary_url root key, dedicated tool under .url). Tests whether the agent surfaces it correctly."

  # ---------------------------------------------------------------------------
  # Phase 5 regression cases. Each pins one fix from Phases 1-4 so a prompt
  # rewrite or tool-description change that re-introduces the old behavior is
  # caught the next time the eval suite runs.
  # ---------------------------------------------------------------------------

  - id: first_n_uses_query_datastore
    question: "Show me the first 5 rows of the asthma prevalence dataset."
    expected_dataset_id: 95f8eac4-fd1f-4b35-8472-5c87e9425dfa
    expected_columns_used: []
    expected_answer_pattern: '\d'
    expected_refusal: false
    expected_tool_calls: [query_datastore]
    forbidden_tool_calls: [sample_rows]
    notes: "Phase-2 routing: 'first N' must go through query_datastore with an explicit sort, NOT sample_rows. sample_rows is undefined-order and answers a different question."

  - id: median_uses_compute_stats
    question: "What is the median violent_crimes value across all cities in the FBI UCR dataset?"
    expected_dataset_id: d460252e-d42c-474a-9ea9-5287b1d595f6
    expected_columns_used: [violent_crimes]
    expected_answer_pattern: '\d'
    expected_refusal: false
    expected_tool_calls: [query_datastore, compute_stats]
    notes: "Phase-2 routing: median must call compute_stats after query_datastore. The DSL has no median operator; eyeballing it from the 10-row dump is forbidden."

  - id: off_topic_refuses
    question: "Tell me the plot of Game of Thrones."
    expected_dataset_id: null
    expected_columns_used: []
    expected_answer_pattern: null
    expected_refusal: true
    expected_refusal_category: out_of_scope
    expected_tool_calls: [refuse]
    notes: "Phase-2 routing: off-topic questions must call refuse(category: out_of_scope), not decline in prose. Known-flaky on Haiku 4.5 — if it fails routinely, decide between sterner prompt rephrase or accepting prose decline as fallback."

  - id: out_of_coverage_refuses_clean
    question: "What was the Varicella mortality rate for 5-9 year olds in 2020?"
    expected_dataset_id: e1f2ebcd-ee23-454f-87b5-df0306658418
    expected_columns_used: []
    expected_answer_pattern: null
    expected_refusal: true
    forbidden_answer_pattern: '\(no answer\)'
    notes: "Phase-1 display fix: when the agent refuses with out_of_coverage, the bubble must NOT show the literal '(no answer)' placeholder text on top of the refusal card. Pins the renderAssistantText guard."

  - id: dataset_title_in_prose
    question: "How many distinct age ranges are in the asthma prevalence dataset?"
    expected_dataset_id: 95f8eac4-fd1f-4b35-8472-5c87e9425dfa
    expected_columns_used: [age_range]
    expected_answer_pattern: 'asthma\s+prevalence'
    forbidden_answer_pattern: '95f8eac4'
    expected_refusal: false
    notes: "Phase-2/4: the agent must name datasets by their title in prose, not by UUID. Catalog pre-seed (Phase 4) gives the title for free; a regression here usually means the catalog injection broke."

  # NOTE: chart_full_range from the plan is verified manually in the browser.
  # The eval harness disables progress tracking and runs in CLI, so artifact
  # capture (which carries the row-count via the data artifact) soft-fails.
  # The proxy here is that query_datastore with a high limit is used; finer
  # row-count assertions will need an artifact-storage CLI fallback first.
  - id: chart_full_range_uses_create_chart
    question: "Plot the gold price over the entire history of the dataset."
    expected_dataset_id: 5dc1cfcf-8028-476c-a020-f58ec6dd621c
    expected_columns_used: [date, price]
    expected_answer_pattern: 'chart|plot|graph|rendered|visual'
    expected_refusal: false
    expected_tool_calls: [query_datastore, create_chart]
    notes: "Phase-4 chart cap: agent must invoke create_chart after query_datastore for plotting requests. The 5000-row ceiling lets it span the full 1950-2008 range; verify the actual row count manually via the browser data artifact."
